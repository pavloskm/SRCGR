<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greece Finite-Fault Slip Model Geobrowser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --ink: #1b1f24;
    --muted: #5b6572;
    --line: #dde1e6;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --accent: #8a1f1f;
    --accent-light: #b8433a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }

  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  header .stats { font-size: 12.5px; color: var(--muted); text-align: right; }
  header .stats b { color: var(--ink); }

  #layout {
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    height: calc(100% - 62px);
  }
  @media (max-width: 980px) {
    #layout { grid-template-columns: 1fr; height: auto; }
    #map { height: 480px; }
  }

  #sidebar {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #filters { padding: 12px; border-bottom: 1px solid var(--line); overflow-y: auto; max-height: 52vh; }
  #filters input[type="text"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; margin-bottom: 10px;
  }
  #filters fieldset { border: none; padding: 0; margin: 0 0 8px 0; }
  #filters legend { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 0; margin-bottom: 4px; }
  #filters label { font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; margin-bottom: 4px; }

  .slider-block { margin-bottom: 12px; }
  .slider-block .sb-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  .dual-slider { position: relative; height: 20px; }
  .dual-slider .ds-track { position: absolute; top: 8px; left: 0; right: 0; height: 4px; background: var(--line); border-radius: 2px; }
  .dual-slider .ds-fill { position: absolute; top: 8px; height: 4px; background: var(--accent); border-radius: 2px; }
  .dual-slider input[type="range"] {
    position: absolute; top: 0; left: 0; width: 100%; height: 20px; margin: 0;
    background: transparent; pointer-events: none; -webkit-appearance: none; appearance: none;
  }
  .dual-slider input[type="range"]::-webkit-slider-runnable-track { background: transparent; -webkit-appearance: none; }
  .dual-slider input[type="range"]::-moz-range-track { background: transparent; }
  .dual-slider input[type="range"]::-webkit-slider-thumb {
    pointer-events: auto; -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 2px solid #fff;
    box-shadow: 0 0 2px rgba(0,0,0,.5); cursor: pointer; margin-top: 2.5px;
  }
  .dual-slider input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 15px; height: 15px; border-radius: 50%; background: var(--accent);
    border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.5); cursor: pointer;
  }
  .ds-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

  #modelList { flex: 1; overflow-y: auto; }
  .model-row { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .model-row:hover { background: #f2f3f5; }
  .model-row.selected { background: #fbeceb; border-left: 3px solid var(--accent); }
  .model-row .name { font-size: 13.5px; font-weight: 600; }
  .model-row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 10px; background: #eef0f2; color: var(--muted); margin-right: 4px; }

  #map { height: 100%; }

  /* --- custom Leaflet-style controls (match native leaflet-bar look) --- */
  .gb-control {
    background: var(--panel);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    font-size: 12px;
  }
  .gb-btn {
    display: block; width: 30px; height: 30px; line-height: 30px; text-align: center;
    cursor: pointer; background: var(--panel); border: none; border-bottom: 1px solid var(--line);
    font-size: 15px; color: var(--ink);
  }
  .gb-btn:last-child { border-bottom: none; }
  .gb-btn:hover { background: #f2f3f5; }
  .gb-btn.active { background: var(--accent); color: #fff; }

  #legendControl { padding: 8px 10px; min-width: 168px; }
  #legendControl .lg-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 5px; }
  #legendControl .lg-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  #legendControl .lg-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #legendControl .lg-line { display: flex; align-items: center; gap: 4px; margin: 4px 0; }
  #legendControl hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }

  #measureLabel {
    position: absolute; background: rgba(27,31,36,.85); color: #fff; font-size: 11.5px;
    padding: 2px 6px; border-radius: 4px; pointer-events: none; transform: translate(-50%, -130%);
  }

  #detail { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; }
  #detail h2 { font-size: 15.5px; margin: 0 0 2px 0; }
  #detail .authors { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  #detail table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 14px; }
  #detail table td { padding: 3px 0; vertical-align: top; }
  #detail table td.k { color: var(--muted); width: 42%; }
  #detail .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px 0; }
  #detail .btn {
    display: inline-block; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; text-decoration: none; color: var(--ink); margin-right: 6px; margin-bottom: 6px;
  }
  #detail .btn:hover { background: #f2f3f5; }
  #detail .empty { color: var(--muted); font-size: 13px; padding-top: 40px; text-align: center; }
  #patchCanvasWrap { text-align: center; }
  #legendRow { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 6px; justify-content: center; }
  .schematic-note { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 6px; }

  .style-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  footer { padding: 6px 20px; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Greece Finite-Fault Slip Model Geobrowser</h1>
    <div class="sub">A FAIR-aligned, community-compiled repository of published coseismic &amp; postseismic slip models &middot; companion to Vavlas &amp; Bonatis, <em>Unveiling the Unseen</em></div>
  </div>
  <div class="stats" id="statsBox"></div>
</header>

<div id="layout">
  <div id="sidebar">
    <div id="filters">
      <input type="text" id="searchBox" placeholder="Search event name or author..." />

      <div class="slider-block">
        <div class="sb-title">Magnitude</div>
        <div class="dual-slider">
          <div class="ds-track"></div>
          <div class="ds-fill" id="magFill"></div>
          <input type="range" id="magMinSlider" />
          <input type="range" id="magMaxSlider" />
        </div>
        <div class="ds-labels"><span id="magMinLabel"></span><span id="magMaxLabel"></span></div>
      </div>

      <div class="slider-block">
        <div class="sb-title">Year</div>
        <div class="dual-slider">
          <div class="ds-track"></div>
          <div class="ds-fill" id="yearFill"></div>
          <input type="range" id="yearMinSlider" />
          <input type="range" id="yearMaxSlider" />
        </div>
        <div class="ds-labels"><span id="yearMinLabel"></span><span id="yearMaxLabel"></span></div>
      </div>

      <fieldset id="styleFilter">
        <legend>Faulting style</legend>
      </fieldset>
      <fieldset id="dataFilter">
        <legend>Data type</legend>
      </fieldset>
    </div>
    <div id="modelList"></div>
  </div>

  <div id="map"></div>

  <div id="detail">
    <div class="empty" id="detailEmpty">Select a model from the list or map to see details.</div>
    <div id="detailContent" style="display:none;"></div>
  </div>
</div>

<footer id="footerNote"></footer>

function starIconHtml(color, sizePx, selected) {

  const pts = [];
  for (let i = 0; i < 10; i++) {

    const angle = -Math.PI / 2 + i * Math.PI / 5;
    pts.push((cx + r * Math.cos(angle)).toFixed(1) + "," + (cy + r * Math.sin(angle)).toFixed(1));

// ---------- geometry helpers (schematic, spherical-earth approximation) ----------
function destPoint(lat, lon, bearingDeg, distKm) {
  const R = 6371;
  const brng = bearingDeg * Math.PI / 180;
  const lat1 = lat * Math.PI / 180;
  const lon1 = lon * Math.PI / 180;
  const dR = distKm / R;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dR) + Math.cos(lat1) * Math.sin(dR) * Math.cos(brng));
  const lon2 = lon1 + Math.atan2(
    Math.sin(brng) * Math.sin(dR) * Math.cos(lat1),
    Math.cos(dR) - Math.sin(lat1) * Math.sin(lat2)
  );
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
}

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function segmentSurfacePolygon(seg) {
  const { strike_deg, dip_deg, length_km, width_km, reference_point } = seg;
  const halfLen = length_km / 2;
  const topLeft = destPoint(reference_point.latitude, reference_point.longitude, (strike_deg + 180) % 360, halfLen);
  const topRight = destPoint(reference_point.latitude, reference_point.longitude, strike_deg, halfLen);
  const downDipAz = (strike_deg + 90) % 360;
  const downDipOffset = width_km * Math.cos(dip_deg * Math.PI / 180);
  const botLeft = destPoint(topLeft[0], topLeft[1], downDipAz, downDipOffset);
  const botRight = destPoint(topRight[0], topRight[1], downDipAz, downDipOffset);
  return [topLeft, topRight, botRight, botLeft];
}

function repPoint(model) {

  return [model.event.hypocenter.latitude, model.event.hypocenter.longitude];
}

// ---------- slip color scale ----------
function slipColor(v, vmax) {
  const stops = [[255,245,204],[253,174,97],[178,24,43],[103,0,13]];
  const t = vmax > 0 ? Math.min(Math.max(v / vmax, 0), 1) : 0;
  const seg = t * (stops.length - 1);
  const i = Math.min(Math.floor(seg), stops.length - 2);
  const f = seg - i;
  const c = stops[i].map((s, idx) => Math.round(s + f * (stops[i+1][idx] - s)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function modelYear(m) {
  if (m.reference && m.reference.year) return m.reference.year;
  if (m.event && m.event.origin_time) return parseInt(m.event.origin_time.slice(0, 4), 10);
  return null;
}

function filteredModels() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const styles = checkedValues("style");
  const dtypes = checkedValues("dtype");

  return MODELS.filter(m => {
    if (q) {
      const hay = (m.event.name + " " + m.reference.authors.join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (magMinVal != null && m.event.magnitude < magMinVal) return false;
    if (magMaxVal != null && m.event.magnitude > magMaxVal) return false;
    if (styles.length && !styles.includes(m.event.faulting_style)) return false;
    if (dtypes.length) {
      const mt = (m.inversion && m.inversion.data_types) || [];
      if (!mt.some(t => dtypes.includes(t))) return false;
    }
    const y = modelYear(m);
    if (y != null) {
      if (yearMinVal != null && y < yearMinVal) return false;
      if (yearMaxVal != null && y > yearMaxVal) return false;
    }
    return true;
  });
}

// ---------- generic dual-handle range slider (two overlaid <input type=range>) ----------
function setupDualSlider(minId, maxId, fillId, minLabelId, maxLabelId, dataMin, dataMax, step, formatFn, onChange) {
  const minEl = document.getElementById(minId);
  const maxEl = document.getElementById(maxId);
  const fillEl = document.getElementById(fillId);
  const minLabelEl = document.getElementById(minLabelId);
  const maxLabelEl = document.getElementById(maxLabelId);

  [minEl, maxEl].forEach(el => { el.min = dataMin; el.max = dataMax; el.step = step; });
  minEl.value = dataMin;
  maxEl.value = dataMax;

  function update() {
    let minV = parseFloat(minEl.value);
    let maxV = parseFloat(maxEl.value);
    if (minV > maxV) { minV = maxV; minEl.value = minV; }
    minEl.max = maxV;
    maxEl.min = minV;
    const range = (dataMax - dataMin) || 1;
    const minPct = ((minV - dataMin) / range) * 100;
    const maxPct = ((maxV - dataMin) / range) * 100;
    fillEl.style.left = minPct + "%";
    fillEl.style.width = Math.max(maxPct - minPct, 0) + "%";
    minLabelEl.textContent = formatFn(minV);
    maxLabelEl.textContent = formatFn(maxV);
    onChange(minV, maxV);
  }
  minEl.addEventListener("input", update);
  maxEl.addEventListener("input", update);
  update();
}

function render() {
  const list = filteredModels();

  const listEl = document.getElementById("modelList");
  listEl.innerHTML = "";
  list.forEach(m => {
    const row = document.createElement("div");
    row.className = "model-row" + (m.model_id === selectedId ? " selected" : "");
    row.innerHTML = `
      <div class="name">${m.event.name}</div>
      <div class="meta">
        <span class="badge">M${m.event.magnitude.toFixed(1)}</span>
        <span class="badge">${m.event.faulting_style}</span>
        <span class="badge">${m.reference.year}</span>
      </div>
      <div class="meta">${m.reference.authors[0]}${m.reference.authors.length > 1 ? " et al." : ""}</div>
    `;
    row.addEventListener("click", () => selectModel(m.model_id));
    listEl.appendChild(row);
  });

  if (eventLayer) map.removeLayer(eventLayer);
  eventLayer = L.layerGroup();
  list.forEach(m => {
    const [lat, lon] = repPoint(m);
    const color = STYLE_COLORS[m.event.faulting_style] || FALLBACK_COLOR;
    const isSelected = m.model_id === selectedId;
    const r = markerRadius(m.event.magnitude);
    let marker;
    if (m.event.magnitude >= STAR_MAG_THRESHOLD) {
      const d = Math.max(r * 2, 14);
      marker = L.marker([lat, lon], {
        icon: L.divIcon({
          html: starIconHtml(color, d, isSelected),
          className: "",
          iconSize: [d, d],
          iconAnchor: [d / 2, d / 2]
        })
      });
    } else {
      marker = L.circleMarker([lat, lon], {
        radius: r,
        color: color,
        weight: isSelected ? 3 : 1.5,
        fillOpacity: 0.55
      });
    }
    marker.bindTooltip(`${m.event.name} — M${m.event.magnitude.toFixed(1)} (${m.reference.year})`);
    marker.on("click", () => selectModel(m.model_id));
    marker.addTo(eventLayer);
  });
  eventLayer.addTo(map);

  document.getElementById("statsBox").innerHTML =
    `<b>${list.length}</b> of ${MODELS.length} models shown &middot; ` +
    `<b>${new Set(MODELS.map(m => m.event.event_id)).size}</b> distinct events`;
}

  content.innerHTML = `
    <h2>${m.event.name}</h2>
    <div class="authors">${(ref.authors || []).join(", ")} (${ref.year || "?"})</div>
    <table>
      <tr><td class="k">Magnitude</td><td>${m.event.magnitude} ${m.event.magnitude_type}</td></tr>
      <tr><td class="k">Faulting style</td><td><span class="style-dot" style="background:${STYLE_COLORS[m.event.faulting_style] || FALLBACK_COLOR}"></span>${m.event.faulting_style}</td></tr>
      <tr><td class="k">Tectonic setting</td><td>${m.event.tectonic_setting || "—"}</td></tr>
      <tr><td class="k">Hypocenter</td><td>${m.event.hypocenter.latitude.toFixed(3)}, ${m.event.hypocenter.longitude.toFixed(3)}, ${m.event.hypocenter.depth_km} km</td></tr>
      <tr><td class="k">Data types</td><td>${(inv.data_types || []).join(", ") || "—"}</td></tr>
      <tr><td class="k">Method</td><td>${inv.method || "—"}</td></tr>
      <tr><td class="k">Slip type</td><td>${inv.slip_type || "—"}</td></tr>
      <tr><td class="k">Max slip</td><td>${sm.max_slip_m != null ? sm.max_slip_m + " m" : "—"}</td></tr>
      <tr><td class="k">Mean slip</td><td>${sm.mean_slip_m != null ? sm.mean_slip_m + " m" : "—"}</td></tr>
      <tr><td class="k">Rupture area</td><td>${sm.rupture_area_km2 != null ? sm.rupture_area_km2 + " km²" : "—"}</td></tr>
      <tr><td class="k">Phase</td><td>${(m.model_variant && m.model_variant.phase) || "coseismic"}</td></tr>
    </table>

    ${ref.doi || ref.url ? `<a class="btn" href="${ref.doi ? "https://doi.org/" + ref.doi : ref.url}" target="_blank" rel="noopener">View publication ↗</a>` : ""}
    <a class="btn" id="downloadBtn" href="#">Download record (JSON)</a>

    <div class="section-title">Slip distribution</div>
    <div id="patchCanvasWrap"></div>
  `;

  document.getElementById("downloadBtn").addEventListener("click", (e) => {
    e.preventDefault();
    const blob = new Blob([JSON.stringify(m, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = m.model_id + ".json";
    a.click();
    URL.revokeObjectURL(url);
  });

  renderPatchGrid(m);

  if (faultLayer) map.removeLayer(faultLayer);
  faultLayer = L.layerGroup();
  (m.fault_segments || []).forEach(seg => {
    const poly = segmentSurfacePolygon(seg);
    L.polygon(poly, { color: STYLE_COLORS[m.event.faulting_style] || "#333", weight: 2, fillOpacity: 0.12 })
      .addTo(faultLayer);
  });
  faultLayer.addTo(map);
  const [lat, lon] = repPoint(m);
  map.setView([lat, lon], 10);
}

function renderPatchGrid(m) {
  const wrap = document.getElementById("patchCanvasWrap");
  const seg = (m.fault_segments || []).find(s => s.patches && s.patches.length);
  if (!seg) {
    wrap.innerHTML = `<div class="schematic-note">Uniform-slip model — no patch-level data reported.</div>`;
    return;
  }
  const patches = seg.patches;
  const xs = [...new Set(patches.map(p => p.along_strike_km))].sort((a, b) => a - b);
  const ys = [...new Set(patches.map(p => p.down_dip_km))].sort((a, b) => a - b);
  const grid = ys.map(() => new Array(xs.length).fill(null));
  patches.forEach(p => {
    grid[ys.indexOf(p.down_dip_km)][xs.indexOf(p.along_strike_km)] = p;
  });

  const cell = 26;
  const w = xs.length * cell;
  const h = ys.length * cell;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.style.border = "1px solid var(--line)";
  const ctx = canvas.getContext("2d");
  const vmax = Math.max(...patches.map(p => p.slip_m));

  grid.forEach((row, yi) => {
    row.forEach((p, xi) => {
      ctx.fillStyle = p ? slipColor(p.slip_m, vmax) : "#eee";
      ctx.fillRect(xi * cell, yi * cell, cell, cell);
      ctx.strokeStyle = "#fff";
      ctx.strokeRect(xi * cell, yi * cell, cell, cell);
    });
  });

  wrap.innerHTML = "";
  wrap.appendChild(canvas);
  const legend = document.createElement("div");
  legend.id = "legendRow";
  legend.innerHTML = `<span>0 m</span><div style="width:80px;height:8px;background:linear-gradient(to right, rgb(255,245,204), rgb(253,174,97), rgb(178,24,43), rgb(103,0,13));"></div><span>${vmax.toFixed(2)} m</span>`;
  wrap.appendChild(legend);
  const note = document.createElement("div");
  note.className = "schematic-note";
  note.textContent = "Top row = shallowest along-dip row. Grid layout schematic, not geolocated.";
  wrap.appendChild(note);
}

// ---------- live seismicity layer (USGS FDSN event webservice) ----------
async function loadSeismicity() {
  try {
    const end = new Date();
    const start = new Date(end.getTime() - 90 * 24 * 3600 * 1000);
    const fmt = d => d.toISOString().slice(0, 10);
    const url = `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson` +
      `&starttime=${fmt(start)}&endtime=${fmt(end)}` +
      `&minlatitude=34&maxlatitude=42&minlongitude=19&maxlongitude=30&minmagnitude=2.5`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const geo = await res.json();
    seismicityLayer.clearLayers();
    geo.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const mag = f.properties.mag;
      const mk = L.circleMarker([lat, lon], {
        radius: 3 + Math.max(mag, 0) * 1.6,
        color: "#e67e22",
        weight: 1,
        fillOpacity: 0.5
      });
      const when = new Date(f.properties.time).toISOString().slice(0, 16).replace("T", " ");
      mk.bindPopup(`<b>M${mag}</b> — ${f.properties.place}<br/>${when} UTC<br/><a href="${f.properties.url}" target="_blank" rel="noopener">USGS event page ↗</a>`);
      mk.addTo(seismicityLayer);
    });
    document.getElementById("seismicityNote").textContent =
      `Live: ${geo.features.length} event(s), last 90 days, M2.5+ (USGS), fetched ${new Date().toISOString().slice(0,16).replace("T"," ")} UTC`;
  } catch (err) {
    document.getElementById("seismicityNote").textContent =
      "Live seismicity layer unavailable (network/CORS blocked in this environment). Works normally once deployed.";
    console.warn("Seismicity fetch failed:", err);
  }
}

// ---------- init ----------
buildFilterCheckboxes("styleFilter", allValues("event", "faulting_style"), "style");
buildFilterCheckboxes("dataFilter", allValues("inversion", "data_types"), "dtype");
document.getElementById("searchBox").addEventListener("input", render);

seismicityLayer.addTo(map);
loadSeismicity();

L.control.layers(
  { "Satellite (Esri)": baseSatellite, "Streets": baseStreets, "Terrain": baseTerrain },
  { "Recent seismicity (USGS, live)": seismicityLayer },
  { position: "topright", collapsed: false }
).addTo(map);

const dataMags = MODELS.map(m => m.event.magnitude);
const magFloor = Math.floor(Math.min(...dataMags) * 10) / 10;
const magCeil = Math.ceil(Math.max(...dataMags) * 10) / 10;
setupDualSlider("magMinSlider", "magMaxSlider", "magFill", "magMinLabel", "magMaxLabel",
  magFloor, magCeil, 0.1, v => v.toFixed(1),
  (lo, hi) => { magMinVal = lo; magMaxVal = hi; render(); });

const dataYears = MODELS.map(modelYear).filter(y => y != null);
const yearFloor = dataYears.length ? Math.min(...dataYears) : 1990;
const yearCeil = dataYears.length ? Math.max(...dataYears) : new Date().getFullYear();
setupDualSlider("yearMinSlider", "yearMaxSlider", "yearFill", "yearMinLabel", "yearMaxLabel",
  yearFloor, yearCeil, 1, v => Math.round(v),
  (lo, hi) => { yearMinVal = lo; yearMaxVal = hi; render(); });

render();
document.getElementById("footerNote").innerHTML =
  `Schematic fault-surface projections (spherical-earth approximation) — for exact geometry consult the source publication. ` +
  `Built ${BUILT_AT} · ${MODEL_COUNT} model(s) · data licensed per-record (see provenance.license). ` +
  `<span id="seismicityNote">Loading live seismicity…</span>`;
</script>
